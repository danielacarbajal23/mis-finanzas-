<script>var SEED = {"version": 1, "config": {"sueldo": 0, "semanal": 0, "semanasMes": 4, "topeHormiga": 0, "avisoHormiga": 0.8, "tasaMP": 0.12, "tasaRevolut": 0.15, "registroPagosDesde": "2000-01-01", "inicioHistorial": null, "ingresoPagaMesSiguiente": false, "ahorroActivo": false, "lastBackup": null, "fuentes": ["Sueldo"]}, "tarjetas": [], "categorias": [{"nombre": "Hormiga", "grupo": "Hormiga"}, {"nombre": "Comida fuera", "grupo": "Hormiga"}, {"nombre": "Ropa y personal", "grupo": "Hormiga"}, {"nombre": "Entretenimiento", "grupo": "Hormiga"}, {"nombre": "Antojos", "grupo": "Hormiga"}, {"nombre": "Súper", "grupo": "Variable"}, {"nombre": "Transporte", "grupo": "Variable"}, {"nombre": "Salud", "grupo": "Variable"}, {"nombre": "Casa", "grupo": "Variable"}, {"nombre": "Mascotas", "grupo": "Variable"}, {"nombre": "Escuela", "grupo": "Variable"}, {"nombre": "Variable", "grupo": "Variable"}, {"nombre": "Otros variables", "grupo": "Variable"}, {"nombre": "Prestado Pp", "grupo": "Variable"}], "fijos": [], "movimientos": [], "cajitas": [], "movCajitas": [], "deudas": [], "abonos": [], "pagosTarjeta": [], "programados": []};</script>
<script>/* ===== Mis Finanzas · lógica (sin interfaz) ===== */
'use strict';
var L = (function () {
  var EPS = 0.005;
  // ---------- fechas ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function daysIn(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function mk(y, m, d) { var b = new Date(y, m, 1); return new Date(b.getFullYear(), b.getMonth(), Math.min(d, daysIn(b.getFullYear(), b.getMonth()))); }
  function parseD(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, p[2] ? +p[2] : 1); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function mkey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function addM(key, n) { var p = key.split('-'); var d = new Date(+p[0], +p[1] - 1 + n, 1); return mkey(d); }
  function mdiff(a, b) { var pa = a.split('-'), pb = b.split('-'); return (+pb[0] - +pa[0]) * 12 + (+pb[1] - +pa[1]); }
  function days(a, b) { return Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5); }
  var MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var MESL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  function fcorta(d) { if (typeof d === 'string') d = parseD(d); return d.getDate() + ' ' + MES[d.getMonth()]; }
  function flarga(d) { if (typeof d === 'string') d = parseD(d); return d.getDate() + ' de ' + MESL[d.getMonth()] + ' ' + d.getFullYear(); }
  function mesNombre(key, largo) { var p = key.split('-'); return (largo ? MESL : MES)[+p[1] - 1] + ' ' + (largo ? p[0] : p[0].slice(2)); }
  function money(n) { n = Math.round((n || 0) * 100) / 100; var s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (n < 0 ? '−$' : '$') + s; }

  // ---------- contexto ----------
  function ctx(S, today) {
    today = today || new Date();
    today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var c = { S: S, today: today, hoy: ymd(today), cur: mkey(today), cache: {} };
    c.tar = {}; S.tarjetas.forEach(function (t) { c.tar[t.id] = t; });
    c.grupo = {}; S.categorias.forEach(function (k) { c.grupo[k.nombre] = k.grupo; });
    return c;
  }
  function metodoNombre(c, m) { if (m === 'debito') return 'Débito'; if (c.tar[m]) return c.tar[m].nombre; var cj = cajita(c, m); return cj ? cj.nombre : m; }
  function cajita(c, id) { for (var i = 0; i < c.S.cajitas.length; i++) if (c.S.cajitas[i].id === id) return c.S.cajitas[i]; return null; }
  function grupoDe(c, cat) { return c.grupo[cat] || 'Variable'; }

  // ---------- tarjetas ----------
  function ciclo(t, fecha) {
    var d = typeof fecha === 'string' ? parseD(fecha) : fecha;
    var y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
    if (day > t.corte || (day === t.corte && !t.entraCorte)) m++;
    var corte = mk(y, m, t.corte);
    var pago = t.pago > t.corte ? mk(corte.getFullYear(), corte.getMonth(), t.pago) : mk(corte.getFullYear(), corte.getMonth() + 1, t.pago);
    return { corte: corte, pago: pago };
  }
  // Ocurrencias de un fijo: cuándo se cobra y cuándo sale el dinero
  function ocurrencias(c, f, hastaKey) {
    var out = [], k = f.desde, fin = (f.hasta && mdiff(f.hasta, hastaKey) >= 0) ? f.hasta : hastaKey;
    for (var i = 0; mdiff(k, fin) >= 0 && i < 240; i++, k = addM(f.desde, i)) {
      var p = k.split('-'); var cobro = mk(+p[0], +p[1] - 1, f.dia);
      var t = c.tar[f.metodo]; var sale = t ? ciclo(t, cobro).pago : cobro;
      out.push({ cobro: cobro, sale: sale, mes: mkey(sale), monto: +f.monto });
    }
    return out;
  }
  // Todo lo que se paga con cada tarjeta, por fecha de pago
  function cargos(c) {
    if (c.cache.cargos) return c.cache.cargos;
    var res = [], horizon = addM(c.cur, 24);
    c.S.movimientos.forEach(function (g) {
      if (g.tipo !== 'gasto') return;
      var t = c.tar[g.metodo]; var n = Math.max(1, +g.meses || 1);
      if (t) {
        var cy = ciclo(t, g.fecha), cuota = (n > 1 && +g.cuota > 0) ? +g.cuota : g.monto / n;
        for (var i = 0; i < n; i++) {
          var pago = mk(cy.pago.getFullYear(), cy.pago.getMonth() + i, t.pago);
          var mm = (n > 1 && +g.cuota > 0 && i === n - 1) ? Math.round((g.monto - cuota * (n - 1)) * 100) / 100 : cuota;
          res.push({ tarjeta: t.id, mes: mkey(pago), pago: pago, corte: i === 0 ? cy.corte : null, monto: mm, concepto: g.concepto, categoria: g.categoria, fecha: g.fecha, i: i + 1, n: n, tipo: 'compra', id: g.id, esFijo: esFijoDup(c, g) });
        }
      }
    });
    c.S.fijos.forEach(function (f) {
      if (!c.tar[f.metodo]) return;
      ocurrencias(c, f, horizon).forEach(function (o) {
        res.push({ tarjeta: f.metodo, mes: o.mes, pago: o.sale, monto: o.monto, concepto: f.nombre, categoria: 'Fijo', fecha: ymd(o.cobro), i: 1, n: 1, tipo: 'fijo', id: f.id });
      });
    });
    // un cobro de fijo registrado como gasto no se cuenta doble
    res = res.filter(function (x) { return !x.esFijo; });
    c.cache.cargos = res; return res;
  }
  function esFijoDup(c, g) {
    if (g.categoria !== 'Fijo') return false;
    return c.S.fijos.some(function (f) { return f.nombre.toLowerCase() === String(g.concepto).toLowerCase(); });
  }
  function aplicaMes(t, fecha) { var d = parseD(fecha); return d.getDate() <= t.pago ? mkey(d) : mkey(mk(d.getFullYear(), d.getMonth() + 1, 1)); }
  // Estados de cuenta de una tarjeta (uno por mes de pago)
  function estados(c, tid) {
    var key = 'est_' + tid; if (c.cache[key]) return c.cache[key];
    var t = c.tar[tid], map = {};
    cargos(c).forEach(function (x) {
      if (x.tarjeta !== tid) return;
      if (!map[x.mes]) map[x.mes] = { mes: x.mes, pago: mk(+x.mes.split('-')[0], +x.mes.split('-')[1] - 1, t.pago), total: 0, items: [] };
      map[x.mes].total += x.monto; map[x.mes].items.push(x);
    });
    var list = Object.keys(map).sort().map(function (k) { return map[k]; });
    list.forEach(function (e) {
      e.corte = mk(e.pago.getFullYear(), e.pago.getMonth() - (t.pago > t.corte ? 0 : 1), t.corte);
      e.pagado = c.S.pagosTarjeta.filter(function (p) { return p.tarjeta === tid && aplicaMes(t, p.fecha) === e.mes; }).reduce(function (a, p) { return a + +p.monto; }, 0);
      e.antes = ymd(e.pago) < c.S.config.registroPagosDesde;
      e.pendiente = e.antes ? 0 : Math.max(0, e.total - e.pagado);
      e.vencido = e.pendiente > EPS && ymd(e.pago) < c.hoy;
      e.abierto = ymd(e.corte) >= c.hoy;
      e.items.sort(function (a, b) { return a.fecha < b.fecha ? -1 : 1; });
    });
    c.cache[key] = list; return list;
  }
  function proximoEstado(c, tid) {
    var l = estados(c, tid);

function leerForm() { var f = $('#regForm'); if (!f) return; var fd = new FormData(f); fd.forEach(function (v, k) { ui.reg[k] = v; }); }
function explicaGasto() {
  var r = ui.reg, monto = num(r.monto), t = C.tar[r.metodo], n = t ? (r.meses || 1) : 1, f = r.fecha || C.hoy;
  if (r.metodo === 'cajita') { var cj = L.cajita(C, r.cajita); return 'Sale de ' + (cj ? cj.nombre : 'la cajita') + ' hoy y se resta de su saldo.'; }

  var cy = L.ciclo(t, f), s = 'Entra al corte del ' + L.fcorta(cy.corte) + ' de ' + t.nombre + ' y se paga el ' + L.fcorta(cy.pago) + '.';
  if (n > 1) { var ult = L.mk(cy.pago.getFullYear(), cy.pago.getMonth() + n - 1, t.pago), cu = num(r.cuota) > 0 ? num(r.cuota) : monto / n; s += ' Son ' + n + ' pagos de ' + M(cu) + (num(r.cuota) > 0 ? ' (el último de ' + M(monto - cu * (n - 1)) + ')' : '') + ', hasta el ' + L.fcorta(ult) + ' ' + ult.getFullYear() + '.'; }

function guardarRegistro() {

  if (!(monto > 0) && !(r.tipo === 'cajita' && r.mov === 'saldo')) { toast('Escribe el monto'); return; }
  if (r.tipo === 'gasto') {
    if (r.metodo === 'cajita') {
      if (!r.cajita) { toast('Elige la cajita'); return; }
      S.movimientos.push({ id: uid(), fecha: f, tipo: 'gasto', concepto: r.concepto || r.categoria, categoria: r.categoria, metodo: 'debito', meses: 1, monto: monto, cajita: r.cajita });

    } else { var g = { id: uid(), fecha: f, tipo: 'gasto', concepto: r.concepto || r.categoria, categoria: r.categoria, metodo: r.metodo, meses: C.tar[r.metodo] ? (r.meses || 1) : 1, monto: monto }; if (g.meses > 1 && num(r.cuota) > 0) g.cuota = num(r.cuota); S.movimientos.push(g); }

  } else if (r.tipo === 'ingreso') {
    var ing = { id: uid(), fecha: f, tipo: 'ingreso', concepto: r.concepto || r.categoria, categoria: r.categoria, metodo: 'debito', meses: 1, monto: monto };
    if (String(r.categoria).indexOf('pc:') === 0) { var pc = (S.porCobrar || []).filter(function (p) { return 'pc:' + p.id === r.categoria; })[0]; ing.porCobrar = pc.id; ing.categoria = 'Me pagó ' + pc.nombre; ing.concepto = r.concepto || ing.categoria; }
    S.movimientos.push(ing);
    ui.repMonto = monto.toFixed(2); ui.reg = { tipo: 'ingreso' }; save(); toast('Ingreso guardado'); go('repartir'); return;
  } else if (r.tipo === 'pago') {
    S.pagosTarjeta.push({ id: uid(), fecha: f, tarjeta: r.tarjeta, monto: monto, cajita: r.cajita || null });
    if (r.cajita) S.movCajitas.push({ id: uid(), fecha: f, cajita: r.cajita, tipo: 'pago', monto: monto, nota: 'Pago de ' + C.tar[r.tarjeta].nombre });
    toast('Pago guardado'); ui.reg = { tipo: 'pago' };
  } else if (r.tipo === 'cajita') {
    if (!r.cajita) { toast('Elige la cajita'); return; }
    S.movCajitas.push({ id: uid(), fecha: f, cajita: r.cajita, tipo: r.mov, monto: monto, nota: r.nota || '' });
    toast('Listo'); ui.reg = { tipo: 'cajita', cajita: r.cajita };
  } else if (r.tipo === 'abono') {
    if (!r.deuda) { toast('Elige la deuda'); return; }
    S.abonos.push({ id: uid(), fecha: f, deuda: r.deuda, monto: monto, origen: r.origen, nota: r.nota || '' });
    if (r.origen === 'apartado') { var cj = L.cajitaDeDeuda(C, r.deuda); if (cj) S.movCajitas.push({ id: uid(), fecha: f, cajita: cj.id, tipo: 'pago', monto: monto, nota: 'Abono a ' + L.deuda(C, r.deuda).nombre }); }
    toast('Abono guardado'); ui.reg = { tipo: 'abono' };
  }
  save(); render();
}

var COL = { fijos: '#1F3864', gastos: '#9AA3B0', deudas: '#B45309', apartados: '#2F7D9A', prog: '#7A5AA6', sobra: '#BFE0CB' };

  var neg = fut.filter(function (m) { return m.sobra < -L.EPS; });

function descargar(nombre, contenido, tipo) {
  var blob = new Blob([contenido], { type: tipo });
  var file; try { file = new File([blob], nombre, { type: tipo }); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: nombre }).catch(function () {}); return; }
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function csv() {
  var rows = [['Fecha', 'Tipo', 'Concepto', 'Categoría', 'Con qué', 'Meses', 'Monto', 'Nota']];
  eventos().slice().reverse().forEach(function (e) { rows.push([e.f, e.k, e.t, e.sub || '', '', '', (e.v < 0 ? -e.v : e.v).toFixed(2), e.d]); });
  var txt = '﻿' + rows.map(function (r) { return r.map(function (x) { x = String(x); return /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(','); }).join('\r\n');
  descargar('mis-finanzas-' + C.hoy + '.csv', txt, 'text/csv');
}
